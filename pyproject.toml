[project]
name = "lait"
version = "0.1.0"
description = "AI Language Coach — local-first learning loop"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.18.5,<2",
  "fastapi>=0.139,<0.140",
  "pydantic>=2.13,<2.14",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
